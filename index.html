<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Crow's Foot</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><defs><linearGradient id='g' x1='4' y1='6' x2='28' y2='26' gradientUnits='userSpaceOnUse'><stop offset='0%25' stop-color='%237c4dff'/><stop offset='45%25' stop-color='%23a78bfa'/><stop offset='100%25' stop-color='%232dd4bf'/></linearGradient></defs><path d='M1.5 16C6.5 7.5 25.5 7.5 30.5 16C25.5 24.5 6.5 24.5 1.5 16Z' fill='%230c0c14' stroke='url(%23g)' stroke-width='2.2'/><circle cx='16' cy='16' r='5.4' fill='url(%23g)'/><circle cx='16' cy='16' r='2.9' fill='%230c0c14'/><circle cx='14.1' cy='14' r='1.3' fill='%23f5c451'/></svg>"
    />
    <script>
      // Applied before first paint so the initial render is not a light-mode flash.
      const stored = localStorage.getItem("crows-foot-theme");
      const dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.classList.toggle("dark", dark);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
